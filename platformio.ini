; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
upload_speed = 460800
build_src_filter = +<*> -<hello_world.cpp>
lib_deps = 
	Wire
	EEPROM
	olikraus/U8g2@^2.35.8

monitor_speed = 74880
build_flags = 
	-D SERIAL_BAUD=74880
	-D SCREEN_WIDTH=128
	-D SCREEN_HEIGHT=64
	-D ENABLE_AUTO_SAVE_STATUS
	-D ENABLE_LOAD_STATE_FROM_EEPROM
	-D AUTO_SAVE_MINUTES=5
	-D TAMA_DISPLAY_FRAMERATE=8
	-D ENABLE_TAMA_SOUND
	-D ENABLE_SERIAL_DEBUG_INPUT
	-D BUTTON_VOLTAGE_LEVEL_PRESSED=LOW
	-D SPEED_DIVIDER=1


[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
build_flags = 
  ${env.build_flags}
  -D TAMA_DISPLAY_FRAMERATE=3

[env:esp8266]
platform = espressif8266
board = esp12e
build_flags = 
  ${env.build_flags}
  -D ESP8266

[env:esp32]
platform = https://github.com/Jason2866/platform-espressif32.git
board = esp32-h2-devkitm-1
board_build.f_cpu = 96000000L
upload_protocol = esptool
board_build.filesystem = littlefs
build_flags = 
	${env.build_flags}
	-D ESP32
	-D SPEED_DIVIDER=2
	-D DEEPSLEEP_INTERVAL=600
	-D ENABLE_DEEPSLEEP=1
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	
lib_deps = 
	${env.lib_deps}
